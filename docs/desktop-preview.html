<!--
  ═══════════════════════════════════════════════════════════════
  KengaOS 0.5 — дизайн системы (desktop + мобильная адаптация)
  ───────────────────────────────────────────────────────────────
  КАК СОХРАНИТЬ В ФАЙЛ:
  1. Выделите ВЕСЬ текст этого файла (Ctrl+A / Cmd+A) и скопируйте.
  2. Создайте на компьютере новый текстовый файл, назовите его:
        kengaos.html
     (важно расширение .html, а не .txt)
  3. Вставьте код и сохраните (Ctrl+S).
  4. Откройте файл двойным кликом в любом браузере.
  Интернет нужен только для обоев и шрифтов (CDN).
  ═══════════════════════════════════════════════════════════════
-->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KengaOS 0.5 — операционная система нового поколения</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cpath d='M24 3 41 12.5v19L24 41 7 31.5v-19z' fill='none' stroke='%238b7bff' stroke-width='3'/%3E%3Cpath d='M18 15v18M18 24l12-9M18 24l12 9' stroke='%2322d3ee' stroke-width='3' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5/index.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/unbounded@5/index.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono@5/index.css" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root{
    --accent:#8b7bff;
    --accent2:#22d3ee;
    --glass:linear-gradient(160deg,rgba(22,28,48,.78),rgba(10,14,26,.72));
    --stroke:rgba(255,255,255,.08);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:'Inter',system-ui,sans-serif;background:#04060b;color:#e8ecf8;overflow:hidden;user-select:none}
  input,textarea{user-select:text}
  .mono{font-family:'JetBrains Mono',monospace}
  .disp{font-family:'Unbounded',sans-serif}
  .hidden{display:none!important}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:4px}
  ::-webkit-scrollbar-track{background:transparent}
  .glass{background:var(--glass);backdrop-filter:blur(22px) saturate(150%);border:1px solid var(--stroke)}
  .fade-out{opacity:0!important;transition:opacity .45s ease}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes popIn{from{opacity:0;transform:scale(.94) translateY(8px)}to{opacity:1;transform:none}}
  @keyframes toastIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
  @keyframes drift1{0%,100%{transform:translate(-6%, -4%) scale(1)}50%{transform:translate(5%,6%) scale(1.15)}}
  @keyframes drift2{0%,100%{transform:translate(4%, 6%) scale(1.1)}50%{transform:translate(-5%,-5%) scale(1)}}

  /* ---------- BOOT ---------- */
  #bootScreen{position:fixed;inset:0;background:#04060b;z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
  #bootScreen .boot-log{width:600px;max-width:88vw;height:150px;overflow:hidden;font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.7;color:#7ee7d0;opacity:.9}
  #bootScreen .boot-log .bl-t{color:rgba(255,255,255,.28)}
  .progress{width:300px;height:4px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden}
  .progress>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .25s ease}

  /* ---------- DESKTOP ---------- */
  #wallpaper{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .5s ease;filter:saturate(1.05)}
  #wallGlow{position:fixed;inset:0;pointer-events:none;mix-blend-mode:screen}
  #wallGlow i{position:absolute;width:55vw;height:55vw;border-radius:50%;filter:blur(90px);opacity:.16}
  #wallGlow i:nth-child(1){background:var(--accent);top:-18vw;left:-12vw;animation:drift1 26s ease-in-out infinite}
  #wallGlow i:nth-child(2){background:var(--accent2);bottom:-20vw;right:-14vw;animation:drift2 30s ease-in-out infinite}
  #vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 40%,transparent 55%,rgba(0,0,0,.45))}

  #topbar{position:fixed;top:0;left:0;right:0;height:38px;z-index:90;display:flex;align-items:center;justify-content:space-between;padding:0 10px;background:rgba(7,10,19,.55);backdrop-filter:blur(20px) saturate(140%);border-bottom:1px solid rgba(255,255,255,.06)}
  .chip{display:flex;align-items:center;gap:6px;padding:3px 9px;border-radius:8px;background:rgba(255,255,255,.06);font-size:11px;color:#cfd8f2;white-space:nowrap}
  .chip b{color:#fff;font-weight:600}
  .rambar{width:52px;height:4px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden}
  .rambar>i{display:block;height:100%;width:40%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .6s}
  .iconbtn{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#cfd8f2;transition:.15s;cursor:pointer;border:none;background:transparent}
  .iconbtn:hover{background:rgba(255,255,255,.1);color:#fff}

  #dock{position:fixed;left:10px;top:50%;transform:translateY(-50%);z-index:90;display:flex;flex-direction:column;gap:6px;padding:10px;border-radius:18px}
  .dock-btn{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#c3cdf0;position:relative;transition:.16s;cursor:pointer;border:1px solid transparent;background:transparent}
  .dock-btn:hover{background:rgba(255,255,255,.09);transform:scale(1.08);color:#fff}
  .dock-btn.active{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.14);color:#fff}
  .dock-btn .run{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--accent2);opacity:0;transition:.2s;box-shadow:0 0 6px var(--accent2)}
  .dock-btn.running .run{opacity:1}

  /* ---------- WINDOWS ---------- */
  .win{position:absolute;min-width:300px;border-radius:14px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.08);animation:popIn .22s cubic-bezier(.2,.9,.3,1.15)}
  .win.focused{box-shadow:0 30px 80px rgba(0,0,0,.65),0 0 0 1.5px color-mix(in srgb,var(--accent) 55%,transparent),0 0 40px color-mix(in srgb,var(--accent) 18%,transparent)}
  .win-bar{height:40px;display:flex;align-items:center;gap:10px;padding:0 12px;background:rgba(255,255,255,.04);border-bottom:1px solid rgba(255,255,255,.06);cursor:grab;flex:none}
  .win-bar:active{cursor:grabbing}
  .tbtns{display:flex;gap:7px}
  .tbtn{width:12px;height:12px;border-radius:50%;border:none;cursor:pointer;opacity:.9;padding:0}
  .tbtn.close{background:#ff5f57}.tbtn.min{background:#febc2e}.tbtn.max{background:#28c840}
  .tbtn:hover{filter:brightness(1.2)}
  .win-title{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:#dfe6ff;letter-spacing:.2px}
  .win-title svg{width:15px;height:15px;color:var(--accent2)}
  .win-tag{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:9px;color:rgba(255,255,255,.35);border:1px solid rgba(255,255,255,.1);padding:2px 7px;border-radius:6px}
  .win-body{flex:1;overflow:hidden;position:relative;background:rgba(8,11,20,.35)}

  /* ---------- TERMINAL ---------- */
  .term-out{font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.65;padding:12px;overflow:auto;height:100%}
  .term-out .cmd{color:#9ff2e0}
  .term-out .cmd::before{content:'❯ ';color:var(--accent)}
  .term-out .out{color:rgba(232,236,248,.82);white-space:pre-wrap}
  .term-out .err{color:#ff8f8f}
  .term-out .dim{color:rgba(255,255,255,.4)}
  .term-out .ok{color:#7ee7a3}

  /* ---------- MISC PANELS ---------- */
  #liveLog{position:fixed;right:10px;bottom:10px;width:320px;z-index:95;border-radius:14px;overflow:hidden}
  #liveLogList{font-family:'JetBrains Mono',monospace;font-size:10px;line-height:1.8;padding:8px 12px;color:rgba(255,255,255,.55);max-height:132px;overflow:hidden}
  #liveLogList .ll-a{color:var(--accent2)}
  #liveLogList .ll-b{color:var(--accent)}

  #launcher{position:fixed;inset:0;z-index:150;background:rgba(4,7,14,.6);backdrop-filter:blur(30px) saturate(140%);display:flex;flex-direction:column;align-items:center;padding-top:9vh;animation:fadeIn .18s ease}
  .launch-grid{display:grid;grid-template-columns:repeat(4,150px);gap:14px;margin-top:26px}
  .launch-item{border-radius:16px;padding:18px 10px 14px;display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;transition:.16s;border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.04)}
  .launch-item:hover{transform:translateY(-4px) scale(1.03);background:rgba(255,255,255,.09);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
  .launch-item .li-ic{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:linear-gradient(140deg,color-mix(in srgb,var(--accent) 30%,transparent),color-mix(in srgb,var(--accent2) 25%,transparent));color:#fff;box-shadow:0 8px 20px color-mix(in srgb,var(--accent) 25%,transparent)}
  .launch-item .li-ic svg{width:22px;height:22px}

  #powerMenu{position:fixed;top:44px;right:10px;z-index:160;border-radius:14px;padding:6px;display:flex;flex-direction:column;gap:2px;width:210px;animation:popIn .16s ease}
  #powerMenu button{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;border:none;background:transparent;color:#dfe6ff;font-size:12.5px;cursor:pointer;text-align:left}
  #powerMenu button:hover{background:rgba(255,255,255,.08)}
  #powerMenu button.danger:hover{background:rgba(255,80,80,.15);color:#ffb4b4}

  #toasts{position:fixed;top:48px;right:12px;z-index:170;display:flex;flex-direction:column;gap:8px;pointer-events:none}
  .toast{width:290px;border-radius:13px;padding:11px 13px;animation:toastIn .25s ease;display:flex;gap:10px;align-items:flex-start}
  .toast .t-ic{width:30px;height:30px;flex:none;border-radius:9px;display:flex;align-items:center;justify-content:center;background:linear-gradient(140deg,var(--accent),var(--accent2));color:#fff}
  .toast .t-ic svg{width:16px;height:16px}

  #lockScreen{position:fixed;inset:0;z-index:200;backdrop-filter:blur(34px) saturate(130%);background:rgba(4,7,14,.5);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;animation:fadeIn .3s ease}
  #lockScreen .lock-hint{animation:blink 2.2s infinite}

  #offScreen{position:fixed;inset:0;background:#000;z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;cursor:pointer}

  .badge{font-family:'JetBrains Mono',monospace;font-size:9px;padding:2px 7px;border-radius:6px;border:1px solid color-mix(in srgb,var(--accent2) 45%,transparent);color:var(--accent2);background:color-mix(in srgb,var(--accent2) 10%,transparent)}
  .badge.cap-u{border-color:color-mix(in srgb,var(--accent) 45%,transparent);color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
  .statdot{width:7px;height:7px;border-radius:50%;background:#3ddc84;box-shadow:0 0 8px #3ddc84}
  .btn-accent{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:10px;cursor:pointer;font-weight:600;transition:.15s;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 30%,transparent)}
  .btn-accent:hover{filter:brightness(1.12);transform:translateY(-1px)}
  .btn-ghost{background:rgba(255,255,255,.07);color:#dfe6ff;border:1px solid rgba(255,255,255,.1);border-radius:10px;cursor:pointer;transition:.15s}
  .btn-ghost:hover{background:rgba(255,255,255,.13)}
  .field{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:10px;color:#fff;outline:none;padding:8px 12px;font-size:12.5px}
  .field:focus{border-color:color-mix(in srgb,var(--accent) 60%,transparent)}
  .msg{max-width:82%;padding:9px 12px;border-radius:13px;font-size:12.5px;line-height:1.5;animation:popIn .18s ease}
  .msg.user{margin-left:auto;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 70%,#000),color-mix(in srgb,var(--accent2) 60%,#000));border-bottom-right-radius:4px}
  .msg.agent{background:rgba(255,255,255,.08);border-bottom-left-radius:4px}
  .msg.agent .who{font-size:9.5px;color:var(--accent2);font-family:'JetBrains Mono',monospace;margin-bottom:3px}
  .file-row{display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:8px;font-size:12px;color:#cfd8f2;cursor:pointer}
  .file-row:hover{background:rgba(255,255,255,.07)}
  .file-row.sel{background:color-mix(in srgb,var(--accent) 18%,transparent);color:#fff}
  .file-row svg{width:14px;height:14px;flex:none;color:rgba(255,255,255,.4)}
  .swatch{width:30px;height:30px;border-radius:10px;cursor:pointer;border:2px solid transparent;transition:.15s}
  .swatch:hover{transform:scale(1.1)}
  .swatch.sel{border-color:#fff}
  .wall-thumb{width:120px;height:72px;object-fit:cover;border-radius:10px;cursor:pointer;border:2px solid transparent;opacity:.75;transition:.15s}
  .wall-thumb:hover{opacity:1}
  .wall-thumb.sel{border-color:var(--accent2);opacity:1}
  .rr-hl{background:color-mix(in srgb,var(--accent2) 14%,transparent)!important}
  table.proct{width:100%;border-collapse:collapse;font-family:'JetBrains Mono',monospace;font-size:10.5px}
  table.proct th{text-align:left;color:rgba(255,255,255,.4);font-weight:500;padding:4px 8px;border-bottom:1px solid rgba(255,255,255,.08)}
  table.proct td{padding:4px 8px;color:#cfd8f2;border-bottom:1px solid rgba(255,255,255,.04)}

  /* ---------- МОБИЛЬНАЯ АДАПТАЦИЯ ---------- */
  @media (max-width: 820px){
    #dock{left:50%;top:auto;bottom:10px;transform:translateX(-50%);flex-direction:row;padding:8px}
    .dock-btn{width:42px;height:42px}
    #liveLog{display:none}
    .hide-m{display:none!important}
    #clockDate{display:none}
    .launch-grid{grid-template-columns:repeat(3,104px);gap:10px}
    .launch-item{padding:12px 6px 10px}
    #launcher{padding-top:6vh}
    .win-bar{height:44px}
    #toasts{left:12px;right:12px}
    .toast{width:auto}
    #bootScreen .boot-log{height:110px}
    #lockScreen #lockTime{font-size:52px}
  }
</style>
</head>
<body>

<!-- ══════════ BOOT ══════════ -->
<div id="bootScreen">
  <svg viewBox="0 0 48 48" width="86" height="86">
    <defs><linearGradient id="lgBoot" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b7bff"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs>
    <path d="M24 3 41 12.5v19L24 41 7 31.5v-19z" fill="none" stroke="url(#lgBoot)" stroke-width="2.4"/>
    <path d="M18 15v18M18 24l12-9M18 24l12 9" stroke="url(#lgBoot)" stroke-width="2.4" stroke-linecap="round" fill="none"/>
  </svg>
  <div class="disp" style="font-size:26px;letter-spacing:6px;background:linear-gradient(90deg,#fff,#9aa7ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent">KENGA<span style="-webkit-text-fill-color:#22d3ee">OS</span></div>
  <div class="mono" style="font-size:10px;color:rgba(255,255,255,.4);letter-spacing:2px">ОПЕРАЦИОННАЯ СИСТЕМА НОВОГО ПОКОЛЕНИЯ · v0.5</div>
  <div class="progress"><i id="bootBar"></i></div>
  <div class="boot-log" id="bootLog"></div>
</div>

<!-- ══════════ POWER OFF ══════════ -->
<div id="offScreen" class="hidden">
  <div class="mono" style="font-size:12px;color:rgba(255,255,255,.35)">Питание выключено</div>
  <div class="mono" style="font-size:10px;color:rgba(255,255,255,.2);animation:blink 2.4s infinite">нажмите, чтобы включить</div>
</div>

<!-- ══════════ LOCK ══════════ -->
<div id="lockScreen" class="hidden">
  <div id="lockTime" class="disp" style="font-size:76px;font-weight:200;letter-spacing:4px;text-shadow:0 10px 60px rgba(0,0,0,.6)">00:00</div>
  <div id="lockDate" style="font-size:15px;color:rgba(255,255,255,.65)"></div>
  <div style="margin-top:34px;width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--accent),var(--accent2));font-weight:700;font-size:20px;box-shadow:0 10px 40px color-mix(in srgb,var(--accent) 40%,transparent)">GM</div>
  <div style="margin-top:8px;font-size:13px">GermannM3 · KengaOS 0.5</div>
  <div class="lock-hint mono" style="margin-top:26px;font-size:10px;color:rgba(255,255,255,.4)">нажмите или Enter — вход</div>
</div>

<!-- ══════════ DESKTOP ══════════ -->
<div id="desktop" class="hidden">
  <img id="wallpaper" alt="" draggable="false">
  <div id="wallGlow"><i></i><i></i></div>
  <div id="vignette"></div>

  <!-- topbar -->
  <div id="topbar">
    <div style="display:flex;align-items:center;gap:8px">
      <button class="iconbtn" id="launcherBtn" title="Лаунчер приложений">
        <svg viewBox="0 0 48 48" width="20" height="20"><path d="M24 3 41 12.5v19L24 41 7 31.5v-19z" fill="none" stroke="url(#lgTop)" stroke-width="3"/><path d="M18 15v18M18 24l12-9M18 24l12 9" stroke="url(#lgTop)" stroke-width="3" stroke-linecap="round" fill="none"/><defs><linearGradient id="lgTop" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b7bff"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs></svg>
      </button>
      <span class="disp" style="font-size:12px;letter-spacing:2px;background:linear-gradient(90deg,#fff,#9aa7ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent">KENGAOS</span>
      <span class="chip mono hide-m" style="font-size:9px">0.5 · agent-native</span>
    </div>
    <div style="position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:baseline;gap:10px">
      <span id="clockTime" class="mono" style="font-size:13px;font-weight:600;color:#fff">00:00:00</span>
      <span id="clockDate" style="font-size:11px;color:rgba(255,255,255,.5)"></span>
    </div>
    <div style="display:flex;align-items:center;gap:6px">
      <span class="chip mono hide-m" title="CPU">CPU <b id="cpuChipVal">12%</b></span>
      <span class="chip mono" title="Память ядра"><span class="hide-m">RAM</span> <span class="rambar"><i id="ramBarFill"></i></span> <b id="ramChipVal">41%</b></span>
      <span class="chip mono hide-m" id="uptimeChip" title="Время работы">⏱ 00:00:00</span>
      <button class="iconbtn" id="powerBtn" title="Питание">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3v8M6.3 6.5a8 8 0 1 0 11.4 0"/></svg>
      </button>
    </div>
  </div>

  <!-- dock -->
  <div id="dock" class="glass"></div>

  <!-- windows -->
  <div id="winLayer" style="position:fixed;inset:0;z-index:100;pointer-events:none"></div>

  <!-- live log -->
  <div id="liveLog" class="glass">
    <div id="liveLogHead" style="display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.06)">
      <span class="statdot" style="animation:blink 1.6s infinite"></span>
      <span class="mono" style="font-size:10px;letter-spacing:1px;color:rgba(255,255,255,.6)">ЖИВОЙ ЛОГ · IPC-ТРАФИК АГЕНТОВ</span>
      <span id="liveLogArrow" class="mono" style="margin-left:auto;font-size:10px;color:rgba(255,255,255,.4)">▾</span>
    </div>
    <div id="liveLogList"></div>
  </div>

  <!-- launcher -->
  <div id="launcher" class="hidden">
    <div class="disp" style="font-size:18px;letter-spacing:5px;color:rgba(255,255,255,.85)">ПРИЛОЖЕНИЯ</div>
    <div style="margin-top:16px;position:relative">
      <input id="launchSearch" class="field" style="width:min(340px,84vw);padding-left:38px" placeholder="Поиск приложений…" autocomplete="off">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="1.8" stroke-linecap="round" style="position:absolute;left:12px;top:50%;transform:translateY(-50%)"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
    </div>
    <div class="launch-grid" id="launchGrid"></div>
    <div class="mono" style="margin-top:34px;font-size:10px;color:rgba(255,255,255,.35)">Esc — закрыть · Enter — открыть первое</div>

</div>

<script>
/* ═════════════════════ БАЗА ═════════════════════ */
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const el = (t, c, h) => { const n = document.createElement(t); if (c) n.className = c; if (h != null) n.innerHTML = h; return n; };
const stamp = () => new Date().toTimeString().slice(0, 8);
const rnd = (a, b) => a + Math.random() * (b - a);
const isSmall = () => window.innerWidth < 820;

const WALLS = [
  'https://image.qwenlm.ai/public_source/79049467-b481-47d0-b098-97fd86e25d35/1d212629b-97ba-4ef2-b7af-988e0e063ea8.png',
  'https://image.qwenlm.ai/public_source/79049467-b481-47d0-b098-97fd86e25d35/130f3f117-3618-43cb-a91c-a0fa14bed41f.png'
];
let wallIdx = 0;

const ICONS = {
  agents: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5"/><circle cx="17" cy="9" r="2.6"/><path d="M15.5 14.4c2.3.2 4.2 1.8 4.8 4.6"/></svg>',
  chat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3v7a3 3 0 0 1-3 3H9l-5 4z"/><path d="M8.5 8.5h7M8.5 11.5h4.5"/></svg>',
  terminal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 9l3.5 3L7 15M13 15h4"/></svg>',
  monitor: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg>',
  files: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',
  settings: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v3M12 18.2v3M21.2 12h-3M5.8 12h-3M18.5 5.5l-2.1 2.1M7.6 16.4l-2.1 2.1M18.5 18.5l-2.1-2.1M7.6 7.6L5.5 5.5"/></svg>',
  about: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 10.8V17M12 7v.2"/></svg>',
  power: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3v8M6.3 6.5a8 8 0 1 0 11.4 0"/></svg>'
};

/* ═════════════════════ СОСТОЯНИЕ СИСТЕМЫ ═════════════════════ */
let zTop = 110, focusedWin = null, bootAt = Date.now(), welcomed = false;
const openWins = {};
let ramPct = 41, cpuPct = 12;
const ramHist = Array(64).fill(41), cpuHist = Array(64).fill(12);
let ipcLog = [];
let rrIdx = 0;

let agents = [
  { name: 'init',        cap: 'CORE',           parent: '—',    desc: 'родитель процессов, дерево агентов' },
  { name: 'ui-agent',    cap: 'CAP_UI',         parent: 'init', desc: 'графическая среда, окна через IPC' },
  { name: 'model-agent', cap: 'CAP_MODEL_INFER',parent: 'init', desc: 'нейросеть MLP (XOR) как процесс' },
  { name: 'shell-agent', cap: 'CAP_SHELL',      parent: 'init', desc: 'интерактивный shell, PS/2 ввод' }
];
let procs = [
  { pid: 0, name: 'idle',        prio: 0 },
  { pid: 1, name: 'init',        prio: 2 },
  { pid: 2, name: 'shell-agent', prio: 1 },
  { pid: 3, name: 'ui-agent',    prio: 1 },
  { pid: 4, name: 'model-agent', prio: 1 }
];
let nextPid = 5;

/* ═════════════════════ BOOT ═════════════════════ */
const BOOT_LINES = [
  '[Limine] протокол 12.6.0 — запросы приняты, long mode',
  '[kenga] emit-c --freestanding → ядро скомпилировано',
  '[fb]    linear framebuffer 1280×800 @ HHDM',
  '[heap]  фрейм-аллокатор: ~94 МБ доступно (bitmap)',
  '[idt]   GDT + IDT установлены, исключения перехвачены',
  '[pit]   таймер 100 Гц · планировщик round-robin',
  '[ps/2]  клавиатура: ring buffer · мышь: XOR-курсор',
  '[vfs]   initrd смонтирован, кириллица: UTF-8 ок',
  '[init]  spawn: ui-agent · model-agent · shell-agent',
  '[desk]  CAP_UI: агент-нативная графическая среда',
  'Привет! KengaOS готова к работе.'
];

async function runBoot() {
  $('#offScreen').classList.add('hidden');
  $('#desktop').classList.add('hidden');
  const bs = $('#bootScreen'); bs.classList.remove('hidden', 'fade-out');
  resetDesktop();
  const log = $('#bootLog'); log.innerHTML = '';
  const bar = $('#bootBar'); bar.style.width = '0%';
  for (let i = 0; i < BOOT_LINES.length; i++) {
    const line = el('div', '', '<span class="bl-t">[' + stamp() + ']</span> ' + BOOT_LINES[i]);
    log.appendChild(line);
    while (log.children.length > 8) log.removeChild(log.firstChild);
    bar.style.width = Math.round((i + 1) / BOOT_LINES.length * 100) + '%';
    await sleep(170 + Math.random() * 160);
  }
  await sleep(420);
  bs.classList.add('fade-out');
  await sleep(460);
  bs.classList.add('hidden');
  enterDesktop();
}

function resetDesktop() {
  $('#winLayer').innerHTML = '';
  for (const k in openWins) delete openWins[k];
  focusedWin = null;
  $('#launcher').classList.add('hidden');
  $('#powerMenu').classList.add('hidden');
  updateDock();
}

function enterDesktop() {
  bootAt = Date.now();
  const d = $('#desktop'); d.classList.remove('hidden');
  setWall(wallIdx, true);
  updateDock();
  if (!welcomed) {
    welcomed = true;
    setTimeout(() => openApp('about'), 350);
    setTimeout(() => { openApp('chat'); }, 700);
    setTimeout(() => toast('KengaOS 0.5', 'Добро пожаловать! Ядро на языке Kenga загружено.'), 1100);
  }
}

/* ═════════════════════ ОБОИ / АКЦЕНТ ═════════════════════ */
function setWall(i, instant) {
  wallIdx = i;
  const img = $('#wallpaper');
  const apply = () => { img.src = WALLS[i]; img.onload = () => { img.style.opacity = 1; }; };
  if (instant) { apply(); } else { img.style.opacity = 0; setTimeout(apply, 260); }
  document.querySelectorAll('.wall-thumb').forEach((t, k) => t.classList.toggle('sel', k === i));
}
function setAccent(a1, a2) {
  document.documentElement.style.setProperty('--accent', a1);
  document.documentElement.style.setProperty('--accent2', a2);
  document.querySelectorAll('.swatch').forEach(s => s.classList.toggle('sel', s.dataset.a === a1));
}

/* ═════════════════════ ЧАСЫ / МЕТРИКИ ═════════════════════ */
function fmtUp() {
  const s = Math.floor((Date.now() - bootAt) / 1000);
  const p = n => String(n).padStart(2, '0');
  return p(Math.floor(s / 3600)) + ':' + p(Math.floor(s / 60) % 60) + ':' + p(s % 60);
}
setInterval(() => {
  const now = new Date();
  const tStr = now.toTimeString().slice(0, 8);
  const dStr = now.toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' });
  if (!$('#desktop').classList.contains('hidden')) {
    $('#clockTime').textContent = tStr;
    $('#clockDate').textContent = dStr;
    $('#uptimeChip').textContent = '⏱ ' + fmtUp();
  }
  if (!$('#lockScreen').classList.contains('hidden')) {
    $('#lockTime').textContent = tStr.slice(0, 5);
    $('#lockDate').textContent = dStr;
  }
}, 1000);

setInterval(() => {
  ramPct = Math.min(62, Math.max(33, ramPct + rnd(-2.4, 2.6)));
  cpuPct = Math.min(58, Math.max(4, cpuPct + rnd(-6, 7)));
  ramHist.push(ramPct); ramHist.shift();
  cpuHist.push(cpuPct); cpuHist.shift();
  if (!$('#desktop').classList.contains('hidden')) {
    $('#cpuChipVal').textContent = Math.round(cpuPct) + '%';
    $('#ramChipVal').textContent = Math.round(ramPct) + '%';
    $('#ramBarFill').style.width = Math.round(ramPct) + '%';
    if (openWins['monitor']) {
      const mr = $('#monRam'); if (mr) mr.textContent = Math.round(ramPct) + '%';
      const mc = $('#monCpu'); if (mc) mc.textContent = Math.round(cpuPct) + '%';
      const mu = $('#monUp'); if (mu) mu.textContent = fmtUp();
      drawSpark($('#ramCanvas'), ramHist, getComputedStyle(document.documentElement).getPropertyValue('--accent2'));
      drawSpark($('#cpuCanvas'), cpuHist, getComputedStyle(document.documentElement).getPropertyValue('--accent'));
      rrIdx = (rrIdx + 1) % procs.length;
      renderProcs();
    }
  }
}, 1000);

function drawSpark(cv, data, color) {
  if (!cv) return;
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth, h = cv.clientHeight;
  if (w === 0) return;
  cv.width = w * dpr; cv.height = h * dpr;
  const ctx = cv.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);
  ctx.strokeStyle = 'rgba(255,255,255,.07)'; ctx.lineWidth = 1;
  for (let gy = 1; gy < 4; gy++) { ctx.beginPath(); ctx.moveTo(0, h * gy / 4); ctx.lineTo(w, h * gy / 4); ctx.stroke(); }
  const col = (color || '#22d3ee').trim();
  ctx.beginPath();
  data.forEach((v, i) => {
    const x = i / (data.length - 1) * w;
    const y = h - (v / 100) * (h - 6) - 3;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.strokeStyle = col; ctx.lineWidth = 1.8; ctx.stroke();
  ctx.lineTo(w, h); ctx.lineTo(0, h); ctx.closePath();
  const gr = ctx.createLinearGradient(0, 0, 0, h);
  gr.addColorStop(0, col + '44'); gr.addColorStop(1, col + '00');
  ctx.fillStyle = gr; ctx.fill();
}

/* ═════════════════════ ЖИВОЙ ЛОГ / ТОСТЫ ═════════════════════ */
function logEvent(a, b, msg) {
  ipcLog.push({ t: stamp(), a, b, msg });
  if (ipcLog.length > 40) ipcLog.shift();
  renderLiveLog();
  const cl = $('#chatLog');
  if (cl) { const d = el('div', '', '[' + stamp() + '] ' + a + ' → ' + b + ': ' + msg); cl.appendChild(d); cl.scrollTop = cl.scrollHeight; }
}
function renderLiveLog() {
  const list = $('#liveLogList'); if (!list) return;
  list.innerHTML = ipcLog.slice(-6).map(e =>
    '<div>[' + e.t + '] <span class="ll-a">' + e.a + '</span> → <span class="ll-b">' + e.b + '</span> · ' + e.msg + '</div>'
  ).join('');
}
const IPC_POOL = [
  ['init', 'ui-agent', 'refresh: часы RTC'],
  ['ui-agent', 'model-agent', 'запрос: предсказание'],
  ['model-agent', 'ui-agent', 'CAP_MODEL_INFER: готов'],
  ['shell-agent', 'init', 'heartbeat ok'],
  ['init', 'shell-agent', 'vfs: initrd ok'],
  ['ui-agent', 'init', 'окно: перерисовка sidebar'],
  ['model-agent', 'init', 'MLP: веса стабильны'],
  ['init', 'ui-agent', 'uptime: синхронизация']
];
setInterval(() => {
  if ($('#desktop').classList.contains('hidden')) return;
  const e = IPC_POOL[Math.floor(Math.random() * IPC_POOL.length)];
  logEvent(e[0], e[1], e[2]);
}, 5200);

function toast(title, body) {
  const t = el('div', 'toast glass',
    '<div class="t-ic">' + ICONS.agents + '</div><div><div style="font-size:12px;font-weight:600">' + title +
    '</div><div style="font-size:11px;color:rgba(255,255,255,.55);margin-top:2px">' + body + '</div></div>');
  $('#toasts').appendChild(t);
  setTimeout(() => { t.classList.add('fade-out'); setTimeout(() => t.remove(), 450); }, 4200);
}

/* ═════════════════════ ОКНА ═════════════════════ */
function createWindow(id, app) {
  const count = Object.keys(openWins).length;
  const small = isSmall();
  const w = el('div', 'win');
  const ww = small ? window.innerWidth - 16 : Math.min(app.w || 540, window.innerWidth - 20);
  const wh = small ? window.innerHeight - 84 : Math.min(app.h || 400, window.innerHeight - 60);
  w.style.width = ww + 'px';
  w.style.height = wh + 'px';
  w.style.left = small ? '8px' : Math.min(window.innerWidth - ww - 16, 96 + count * 42) + 'px';
  w.style.top = small ? '46px' : Math.min(window.innerHeight - wh - 50, 64 + count * 34) + 'px';
  w.innerHTML =
    '<div class="win-bar">' +
      '<div class="tbtns"><button class="tbtn close" title="Закрыть"></button><button class="tbtn min" title="Свернуть"></button><button class="tbtn max" title="Развернуть"></button></div>' +
      '<div class="win-title">' + ICONS[app.icon] + app.name + '</div>' +
      '<div class="win-tag">' + (app.tag || 'kenga') + '</div>' +
    '</div>' +
    '<div class="win-body">' + app.html() + '</div>';
  w.addEventListener('pointerdown', () => focusWin(w));
  const bar = w.querySelector('.win-bar');
  bar.addEventListener('pointerdown', e => {
    if (e.target.closest('.tbtn')) return;
    if (small) return;
    const r = w.getBoundingClientRect();
    const ox = e.clientX - r.left, oy = e.clientY - r.top;
    const move = ev => {
      w.style.left = Math.max(-80, Math.min(window.innerWidth - 120, ev.clientX - ox)) + 'px';
      w.style.top = Math.max(40, Math.min(window.innerHeight - 60, ev.clientY - oy)) + 'px';
    };
    const up = () => { window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); };
    window.addEventListener('pointermove', move); window.addEventListener('pointerup', up);
  });
  w.querySelector('.tbtn.close').onclick = e => { e.stopPropagation(); closeWin(id); };
  w.querySelector('.tbtn.min').onclick = e => { e.stopPropagation(); minimizeWin(id); };
  w.querySelector('.tbtn.max').onclick = e => { e.stopPropagation(); toggleMax(id); };
  return w;
}
function focusWin(w) {
  zTop += 1; w.style.zIndex = zTop; w.style.pointerEvents = 'auto';
  document.querySelectorAll('.win').forEach(x => x.classList.remove('focused'));
  w.classList.add('focused');
  focusedWin = w; updateDock();
}
function openApp(id) {
  const ex = openWins[id];
  if (ex) { if (ex.min) restoreWin(id); else focusWin(ex.el); return; }
  const app = APPS[id];
  const w = createWindow(id, app);
  w.style.pointerEvents = 'auto';
  openWins[id] = { el: w, min: false, max: false, prev: null };
  $('#winLayer').appendChild(w);
  focusWin(w); updateDock();
  if (app.onOpen) app.onOpen(w);
}
function closeWin(id) {
  const w = openWins[id]; if (!w) return;
  w.el.classList.add('fade-out');
  setTimeout(() => w.el.remove(), 200);
  delete openWins[id];
  if (focusedWin === w.el) focusedWin = null;
  updateDock();
}
function minimizeWin(id) {
  const w = openWins[id]; if (!w || w.min) return;
  w.min = true;
  w.el.style.transition = 'transform .18s ease, opacity .18s ease';
  w.el.style.transform = 'scale(.7) translateY(34vh)'; w.el.style.opacity = '0';
  setTimeout(() => { w.el.style.display = 'none'; }, 190);
  if (focusedWin === w.el) { focusedWin = null; updateDock(); }
}
function restoreWin(id) {
  const w = openWins[id]; if (!w) return;
  w.min = false; w.el.style.display = 'flex';
  requestAnimationFrame(() => {
    w.el.style.transform = ''; w.el.style.opacity = '';
    setTimeout(() => { w.el.style.transition = ''; }, 220);
  });
  focusWin(w.el);
}
function toggleMax(id) {
  const w = openWins[id]; if (!w) return;
  const s = w.el.style;
  if (!w.max) {
    w.prev = { left: s.left, top: s.top, width: s.width, height: s.height };
    s.left = '8px'; s.top = '46px'; s.width = 'calc(100vw - 16px)'; s.height = 'calc(100vh - ' + (isSmall() ? 84 : 56) + 'px)';
    w.max = true;
  } else {
    Object.assign(s, w.prev); w.max = false;
  }
}

/* ═════════════════════ DOCK ═════════════════════ */
const DOCK_APPS = ['agents', 'chat', 'terminal', 'monitor', 'files', 'settings', 'about'];
function buildDock() {
  const dock = $('#dock'); dock.innerHTML = '';
  DOCK_APPS.forEach(id => {
    const b = el('button', 'dock-btn', ICONS[APPS[id].icon] + '<span class="run"></span>');
    b.title = APPS[id].name; b.dataset.app = id;
    b.onclick = () => {
      if (!openWins[id]) openApp(id);
      else if (openWins[id].min) restoreWin(id);
      else if (focusedWin === openWins[id].el) minimizeWin(id);
      else focusWin(openWins[id].el);
    };
    dock.appendChild(b);
  });
}
function updateDock() {
  document.querySelectorAll('.dock-btn').forEach(b => {
    const id = b.dataset.app;
    b.classList.toggle('running', !!openWins[id]);
    b.classList.toggle('active', !!openWins[id] && openWins[id].el === focusedWin);
  });
}

/* ═════════════════════ ПРИЛОЖЕНИЯ ═════════════════════ */
const APPS = {
  agents: {
    name: 'Агенты', icon: 'agents', w: 620, h: 430, tag: 'CAP_UI',
    html: () =>
      '<div style="display:flex;height:100%;flex-wrap:wrap">' +
        '<div id="agentListEl" style="flex:1;min-width:260px;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px"></div>' +
        '<div style="width:216px;border-left:1px solid rgba(255,255,255,.07);padding:14px;display:flex;flex-direction:column;gap:10px">' +
          '<div class="mono" style="font-size:10px;letter-spacing:1px;color:rgba(255,255,255,.45)">K_PROC_SPAWN</div>' +
          '<div style="font-size:12px;color:rgba(255,255,255,.65);line-height:1.5">Агент — системная сущность KengaOS: живая память, capability-права, русский ответ.</div>' +
          '<form id="spawnForm" style="display:flex;flex-direction:column;gap:8px">' +
            '<input id="spawnInput" class="field" placeholder="имя агента…" autocomplete="off" maxlength="18">' +
            '<button class="btn-accent" style="padding:8px">Создать агента</button>' +
          '</form>' +
          '<div class="mono" style="font-size:9.5px;color:rgba(255,255,255,.35)">дерево: init → системные → пользовательские</div>' +
        '</div>' +
      '</div>',
    onOpen: w => {
      renderAgents();
      w.querySelector('#spawnForm').onsubmit = e => {
        e.preventDefault();

        inp.value = '';

      };

  },
  chat: {
    name: 'Kenga Агент', icon: 'chat', w: 470, h: 470, tag: 'IPC · CAP_UI',

      '<div style="display:flex;flex-direction:column;height:100%">' +
        '<div id="chatMsgs" style="flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:8px"></div>' +
        '<div id="chatLog" class="mono" style="height:58px;overflow:auto;padding:6px 12px;font-size:9.5px;color:rgba(255,255,255,.38);border-top:1px solid rgba(255,255,255,.07)"></div>' +
        '<form id="chatForm" style="padding:10px;border-top:1px solid rgba(255,255,255,.07);display:flex;gap:8px">' +
          '<input id="chatInput" class="field" style="flex:1;min-width:0" placeholder="Спросить агента… (привет / память / время)" autocomplete="off">' +
          '<button class="btn-accent" style="padding:8px 16px">➤</button>' +
        '</form>' +
      '</div>',
    onOpen: w => {
      const msgs = w.querySelector('#chatMsgs');
      if (msgs.children.length === 0) pushAgentMsg('Привет! Я системный агент KengaOS. Спросите меня о памяти, агентах, модели или времени — либо просто напишите «привет».');
      w.querySelector('#chatForm').onsubmit = e => {
        e.preventDefault();
        const inp = w.querySelector('#chatInput');
        const txt = inp.value.trim(); if (!txt) return;
        inp.value = '';
        sendChat(txt);
      };
    }
  },
  terminal: {

function renderAgents() {
  const box = $('#agentListEl'); if (!box) return;
  box.innerHTML = agents.map(a =>
    '<div class="glass" style="border-radius:12px;padding:11px 13px;display:flex;align-items:center;gap:11px">' +
      '<span class="statdot"></span>' +
      '<div style="flex:1;min-width:0"><div style="display:flex;align-items:center;gap:8px"><span class="mono" style="font-size:12.5px;font-weight:600;color:#fff">' + a.name + '</span>' +
      '<span class="badge' + (a.cap === 'CAP_UI' || a.cap === 'CORE' ? '' : ' cap-u') + '">' + a.cap + '</span></div>' +
      '<div style="font-size:10.5px;color:rgba(255,255,255,.45);margin-top:2px">parent: ' + a.parent + ' · ' + a.desc + '</div></div>' +
      '<button class="btn-ghost" style="padding:6px 11px;font-size:10.5px" data-ask="' + a.name + '">спросить</button>' +
    '</div>'
  ).join('');
  box.querySelectorAll('[data-ask]').forEach(b => b.onclick = () => {
    openApp('chat');
    setTimeout(() => sendChat('привет, ' + b.dataset.ask + '!'), 250);
  });
}
function spawnAgent(nm) {
  agents.push({ name: nm, cap: 'CAP_USER', parent: 'init', desc: 'пользовательский агент' });
  procs.push({ pid: nextPid++, name: nm, prio: 1 });
  renderAgents(); renderProcs();
  logEvent('init', nm, 'spawn: агент создан (capability выданы)');
  toast('Новый агент', nm + ' создан · parent: init');
}

/* ═════════════════════ ЧАТ ═════════════════════ */
function pushAgentMsg(text) {
  const msgs = $('#chatMsgs'); if (!msgs) return;
  const m = el('div', 'msg agent', '<div class="who">kenga-agent · IPC</div>' + text);
  msgs.appendChild(m); msgs.scrollTop = msgs.scrollHeight;
  return m;
}
function agentReply(text) {
  const t = text.toLowerCase();
  if (/прив|здрав|hello/.test(t)) return 'Привет! 👋 Я агент KengaOS — системная сущность с живой памятью. Чем помочь?';
  if (/памят|ram|mem/.test(t)) return 'Heap ядра: занято ~' + Math.round(ramPct) + '% из 94 МБ фреймов. Аллокатор — bitmap, живу в верхней половине (HHDM).';
  if (/врем|час|date|time|uptime|аптайм/.test(t)) return 'Сейчас ' + new Date().toLocaleTimeString('ru-RU') + '. Аптайм ядра: ' + fmtUp() + ' (PIT 100 Гц).';
  if (/модел|mlp|xor|нейросет/.test(t)) return 'model-agent — настоящая MLP (XOR) как процесс. Попробуйте в терминале: model 1 0 → предсказание через IPC с CAP_MODEL_INFER.';
  if (/агент|agent|процесс/.test(t)) return 'Нас сейчас ' + agents.length + '. Дерево: init → системные агенты → пользовательские. Создайте нового через окно «Агенты» или команду spawn.';
  if (/файл|file|vfs/.test(t)) return 'VFS + initrd смонтированы: kernel/, scripts/, docs/. Откройте окно «Файлы» или ls в терминале.';
  if (/помощ|help|команд/.test(t)) return 'В терминале: help, ps, mem, agents, spawn, model a b, ask, log, reboot… А ещё окна: Агенты, Монитор, Файлы, Настройки.';
  if (/кто ты|what/.test(t)) return 'Я — Kenga-агент: процесс с CAP_UI и живой памятью (remember/recall). Отвечаю по-русски, общаюсь через IPC send/recv.';
  const pool = [
    'Принято через IPC. Запомнил в живой памяти (remember).',
    'Квант планировщика завершён — отвечаю: интересно! Уточните запрос.',
    'Мой CAP позволяет UI и память. Попробуйте спросить про память, время или модель.',
    'Передал событие в живой лог. Система стабильна, heap в норме.'
  ];
  return pool[Math.floor(Math.random() * pool.length)];
}
function sendChat(txt) {
  const msgs = $('#chatMsgs'); if (!msgs) return;
  msgs.appendChild(el('div', 'msg user', txt));
  msgs.scrollTop = msgs.scrollHeight;
  logEvent('you', 'kenga-agent', txt.slice(0, 40));
  setTimeout(() => {
    const typing = pushAgentMsg('<span style="opacity:.5">печатает…</span>');
    setTimeout(() => {
      typing.innerHTML = '<div class="who">kenga-agent · IPC</div>' + agentReply(txt);
      msgs.scrollTop = msgs.scrollHeight;
      logEvent('kenga-agent', 'you', 'ответ доставлен');
    }, 700 + Math.random() * 600);
  }, 250);
}

function buildFileTree(w) {
  const tree = w.querySelector('#fileTree');
  const view = w.querySelector('#fileView');
  view.textContent = '← выберите файл (VFS + initrd через Limine)';
  const render = (node, depth) => {
    const rows = [];
    (node.kids || []).forEach(kid => {
      const r = el('div', 'file-row', (kid.type === 'dir'
        ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>'
        : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5"/></svg>') +
        '<span>' + kid.name + '</span>');
      r.style.marginLeft = depth * 14 + 'px';
      if (kid.type === 'dir') {
        r.onclick = () => {
          const open = r.dataset.open === '1';
          r.dataset.open = open ? '0' : '1';
          tree.querySelectorAll('[data-parent="' + kid.name + '"]').forEach(x => x.style.display = open ? 'none' : '');
        };
        r.dataset.open = '1';
      } else {
        r.onclick = () => {
          tree.querySelectorAll('.file-row').forEach(x => x.classList.remove('sel'));
          r.classList.add('sel');
          view.textContent = kid.content;
        };
      }
      rows.push(r);
      if (kid.type === 'dir') {
        render(kid, depth + 1).forEach(x => { x.dataset.parent = kid.name; rows.push(x); });
      }
    });
    return rows;
  };
  render(FS, 0).forEach(r => tree.appendChild(r));
}

  echo: (t, a) => termPrint(t, a.join(' '), 'out'),
  mem: t => termPrint(t, 'heap: занято ~' + Math.round(ramPct) + '% · свободно ' + Math.round(94 * (100 - ramPct) / 100) + ' МБ из 94 МБ\nфрейм-аллокатор: bitmap ok', 'out'),
  ps: t => termPrint(t, 'PID  ИМЯ           ПРИО\n' + procs.map(p => String(p.pid).padEnd(5) + p.name.padEnd(14) + p.prio).join('\n'), 'out'),
  tasks: (t, a) => CMDS.ps(t, a),
  agents: t => termPrint(t, agents.map(a => a.name.padEnd(14) + a.cap.padEnd(16) + 'parent: ' + a.parent).join('\n'), 'out'),
  log: t => termPrint(t, ipcLog.slice(-8).map(e => '[' + e.t + '] ' + e.a + ' → ' + e.b + ': ' + e.msg).join('\n') || '(пусто)', 'dim'),
  spawn: (t, a) => { const nm = a[0] || ('agent-' + nextPid); spawnAgent(nm); termPrint(t, 'init: агент ' + nm + ' создан (spawn ok)', 'ok'); },
  ask: (t, a) => termPrint(t, 'kenga-agent: ' + agentReply(a.join(' ')), 'ok'),
  model: (t, a) => {
    const x = +a[0], y = +a[1];
    if (a.length < 2 || (x !== 0 && x !== 1) || (y !== 0 && y !== 1)) return termPrint(t, 'использование: model 0|1 0|1', 'err');
    const r = x ^ y;
    logEvent('shell', 'model-agent', 'model ' + x + ' ' + y);
    termPrint(t, 'model-agent (MLP XOR): ' + x + ' ⊕ ' + y + ' = ' + r + '  · уверенность 0.9' + (7 - r * 2), 'ok');
  },
  ls: t => termPrint(t, FS.kids.map(k => k.type === 'dir' ? k.name + '/' : k.name).join('   '), 'out'),
  cat: (t, a) => {
    let found = null;
    FS.kids.forEach(k => { if (k.content && k.name === a[0]) found = k; if (k.kids) k.kids.forEach(f => { if (f.name === a[0]) found = f; }); });
    found ? termPrint(t, found.content, 'out') : termPrint(t, 'cat: файл не найден: ' + a[0], 'err');
  },
  time: t => termPrint(t, 'uptime: ' + fmtUp() + ' · тиков PIT: ' + Math.floor((Date.now() - bootAt) / 10), 'out'),
  date: t => termPrint(t, new Date().toLocaleString('ru-RU', { dateStyle: 'full', timeStyle: 'medium' }), 'out'),
  cpuinfo: t => termPrint(t, 'CPUID: Kenga x86_64 · long mode · HHDM\nPIT 100 Гц · UART 16550 (0x3f8)', 'out'),
  mmap: t => termPrint(t, '0x00000000–0x0009ffff  reserved\n0x00100000–0x05e00000  free  (~94 МБ фреймов)\n0xffffffff80000000+   ядро (higher-half, HHDM)', 'out'),
  demo: t => {
    termPrint(t, '──────────────────────────────\n  K E N G A O S  ·  0.5\n  agent-native · x86_64 · kenga\n──────────────────────────────', 'ok');
    toast('Демо', 'Демо ядра завершено успешно');
  },
  reboot: t => { termPrint(t, 'перезагрузка…', 'dim'); setTimeout(runBoot, 600); },
  poweroff: t => { termPrint(t, 'выключение…', 'dim'); setTimeout(doPowerOff, 600); }
};
function termExec(raw) {
  const out = $('#termOut');
  termPrint(out, raw, 'cmd');
  const parts = raw.trim().split(/\s+/);
  const cmd = parts[0], args = parts.slice(1);
  if (!cmd) return;
  if (cmd === 'clear') { out.innerHTML = ''; return; }
  if (CMDS[cmd]) CMDS[cmd](out, args);
  else termPrint(out, 'kenga: команда не найдена: ' + cmd + ' — введите help', 'err');
  out.scrollTop = out.scrollHeight;
}

/* ═════════════════════ LAUNCHER / ПИТАНИЕ ═════════════════════ */
function renderLauncher(filter) {
  const grid = $('#launchGrid'); grid.innerHTML = '';
  Object.keys(APPS).filter(id => APPS[id].name.toLowerCase().includes((filter || '').toLowerCase())).forEach(id => {
    const it = el('div', 'launch-item', '<div class="li-ic">' + ICONS[APPS[id].icon] + '</div><div style="font-size:12.5px;font-weight:600">' + APPS[id].name + '</div><div class="mono" style="font-size:9px;color:rgba(255,255,255,.35)">' + (APPS[id].tag || '') + '</div>');
    it.onclick = () => { closeLauncher(); openApp(id); };
    grid.appendChild(it);
  });
}
function openLauncher() { renderLauncher(''); $('#launcher').classList.remove('hidden'); $('#launchSearch').value = ''; $('#launchSearch').focus(); }
function closeLauncher() { $('#launcher').classList.add('hidden'); }

function doPowerOff() {
  $('#powerMenu').classList.add('hidden');
  $('#desktop').classList.add('hidden');
  $('#lockScreen').classList.add('hidden');
  $('#offScreen').classList.remove('hidden');
}

/* ═════════════════════ СОБЫТИЯ ═════════════════════ */
$('#launcherBtn').onclick = openLauncher;
$('#launchSearch').oninput = e => renderLauncher(e.target.value);
$('#launchSearch').onkeydown = e => {
  if (e.key === 'Enter') { const first = $('#launchGrid .launch-item'); if (first) first.click(); }
};
$('#powerBtn').onclick = e => { e.stopPropagation(); $('#powerMenu').classList.toggle('hidden'); };
$('#pmLock').onclick = () => { $('#powerMenu').classList.add('hidden'); $('#lockScreen').classList.remove('hidden'); };
$('#pmReboot').onclick = () => { $('#powerMenu').classList.add('hidden'); runBoot(); };
$('#pmOff').onclick = doPowerOff;
$('#offScreen').onclick = runBoot;
$('#lockScreen').onclick = () => $('#lockScreen').classList.add('hidden');
$('#liveLogHead').onclick = () => {
  const l = $('#liveLogList');
  l.classList.toggle('hidden');
  $('#liveLogArrow').textContent = l.classList.contains('hidden') ? '▸' : '▾';
};
document.addEventListener('click', e => {
  if (!e.target.closest('#powerMenu') && !e.target.closest('#powerBtn')) $('#powerMenu').classList.add('hidden');
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeLauncher(); $('#powerMenu').classList.add('hidden'); }
  if (e.key === 'Enter' && !$('#lockScreen').classList.contains('hidden')) $('#lockScreen').classList.add('hidden');
});

/* ═════════════════════ СТАРТ ═════════════════════ */
buildDock();
WALLS.forEach(u => { const i = new Image(); i.src = u; });
runBoot();
</script>
