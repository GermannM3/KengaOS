name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  release-tools:
    name: Release manifest + rollback fault tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run release fault tests
        run: python3 -m unittest discover -s tests -v

  os-smoke:
    name: Build ISO + QEMU smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Rust toolchain (kenga-lang compiler)
        uses: dtolnay/rust-toolchain@stable

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso qemu-system-x86 clang lld gcc

      - name: Build + smoke test
        run: ./scripts/build.sh
      - name: Verify release artifacts
        run: python3 scripts/release_gate.py --build build

  os-smoke-aarch64:
    name: Build aarch64 kernel + QEMU smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Rust toolchain (kenga-lang compiler)
        uses: dtolnay/rust-toolchain@stable

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-aarch64 qemu-efi-aarch64 mtools xorriso clang lld gcc

      - name: Build aarch64 kernel
        run: ./scripts/build-a64.sh

      - name: QEMU smoke test (headless)
        run: ./scripts/run-a64.sh --headless
