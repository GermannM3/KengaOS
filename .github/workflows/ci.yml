name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  os-smoke:
    name: Build ISO + QEMU smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso qemu-system-x86 clang lld gcc

      - name: Build + smoke test
        run: ./scripts/build.sh