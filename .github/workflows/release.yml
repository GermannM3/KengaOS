name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Kenga toolchain — desktop + mobile, built from the pinned kenga-lang submodule.
  toolchain:
    name: kenga ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: kenga-linux-x86_64
            lite: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: kenga-windows-x86_64
            ext: .exe
            lite: true
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: kenga-macos-arm64
            lite: true
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: kenga-macos-x86_64
            lite: true
          - os: ubuntu-latest
            target: aarch64-linux-android
            artifact: kenga-android-aarch64
            lite: false
          - os: ubuntu-latest
            target: armv7-linux-androideabi
            artifact: kenga-android-armv7
            lite: false
          - os: macos-latest
            target: aarch64-apple-ios
            artifact: kenga-ios-aarch64
            lite: false
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: kenga-lang

      - name: Install Android NDK
        if: contains(matrix.target, 'android')
        shell: bash
        run: |
          set -euxo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSLo ndk.zip "https://dl.google.com/android/repository/android-ndk-r27c-linux.zip"
          unzip -q ndk.zip
          echo "ANDROID_NDK_HOME=$RUNNER_TEMP/android-ndk-r27c" >> "$GITHUB_ENV"

      - name: Configure Android cross toolchain
        if: contains(matrix.target, 'android')
        shell: bash
        run: |
          NDK="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          case "${{ matrix.target }}" in
            aarch64-linux-android)
              echo "CC_aarch64_linux_android=$NDK/aarch64-linux-android26-clang" >> "$GITHUB_ENV"
              echo "AR_aarch64_linux_android=$NDK/llvm-ar" >> "$GITHUB_ENV"
              echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$NDK/aarch64-linux-android26-clang" >> "$GITHUB_ENV"
              ;;
            armv7-linux-androideabi)
              echo "CC_armv7_linux_androideabi=$NDK/armv7a-linux-androideabi26-clang" >> "$GITHUB_ENV"
              echo "AR_armv7_linux_androideabi=$NDK/llvm-ar" >> "$GITHUB_ENV"
              echo "CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER=$NDK/armv7a-linux-androideabi26-clang" >> "$GITHUB_ENV"
              ;;
          esac

      - name: Build release (kenga-lang submodule)
        working-directory: kenga-lang
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Pack (Windows, desktop)
        if: runner.os == 'Windows' && matrix.lite == true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ../dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/kenga.exe" "../dist/${{ matrix.artifact }}.exe"
          cmd /c "bootstrap\build.cmd"
          if ($LASTEXITCODE -ne 0) { throw "bootstrap\build.cmd failed" }
          if (-not (Test-Path "bootstrap\bin\kenga-lite.exe")) { throw "kenga-lite.exe missing" }
          Copy-Item "bootstrap\bin\kenga-lite.exe" "../dist/kenga-lite.exe"
          Compress-Archive -Path "../dist/${{ matrix.artifact }}.exe","../dist/kenga-lite.exe" -DestinationPath "../dist/${{ matrix.artifact }}.zip" -Force

      - name: Pack (Unix, desktop)
        if: runner.os != 'Windows' && matrix.lite == true
        working-directory: kenga-lang
        run: |
          mkdir -p ../dist
          cp "target/${{ matrix.target }}/release/kenga" "../dist/${{ matrix.artifact }}"
          chmod +x "../dist/${{ matrix.artifact }}"
          mkdir -p bootstrap/bin
          cc -O2 -std=c99 bootstrap/kenga_lite.c -lm -o bootstrap/bin/kenga-lite
          cp bootstrap/bin/kenga-lite ../dist/kenga-lite
          chmod +x ../dist/kenga-lite
          cd ../dist && tar -czf "${{ matrix.artifact }}.tar.gz" "${{ matrix.artifact }}" kenga-lite

      - name: Pack (Unix, mobile)
        if: runner.os != 'Windows' && matrix.lite == false
        working-directory: kenga-lang
        run: |
          mkdir -p ../dist
          cp "target/${{ matrix.target }}/release/kenga" "../dist/${{ matrix.artifact }}"
          chmod +x "../dist/${{ matrix.artifact }}"
          cd ../dist && tar -czf "${{ matrix.artifact }}.tar.gz" "${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  # KengaOS bootable ISO — kernel + Limine, smoke-tested in QEMU.
  iso:
    name: KengaOS ISO (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso qemu-system-x86 clang lld gcc

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build KengaOS ISO
        run: ./scripts/build.sh

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: kengaos-iso-x86_64
          path: |
            build/kengaos.iso
            build/uart.log

  publish:
    needs: [toolchain, iso]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*